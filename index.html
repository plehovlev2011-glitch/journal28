<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>newpos :: старший менеджер плехов лев</title>
    <style>
        /* тотальный бело-серый, никаких украшений, никаких эмодзи, минимум контраста */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', 'Helvetica', sans-serif;
        }

        body {
            background: #969696; 
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* главный контейнер - всё серое и плоское */
        .terminal {
            width: 1480px;
            max-width: 100%;
            height: 960px;
            max-height: 98vh;
            background: #b0b0b0;  /* серый бетон */
            border: 2px solid #6f6f6f;
            display: flex;
            flex-direction: column;
            color: #1e1e1e;
            font-size: 15px;
            font-weight: 400;
            box-shadow: none;
        }

        /* верхняя полоска - никаких эмодзи, строгий текст */
        .top-bar {
            background: #9f9f9f;
            padding: 10px 12px;
            border-bottom: 3px solid #7a7a7a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: lowercase;
            letter-spacing: 0px;
        }

        .employee-title {
            background: #8a8a8a;
            color: #222;
            padding: 6px 24px;
            font-size: 1.6rem;
            font-weight: 600;
            border: 2px solid #6a6a6a;
            font-family: 'Courier New', monospace;
        }

        .full-name {
            font-size: 2rem;
            background: #8e8e8e;
            padding: 6px 40px;
            border: 2px solid #6f6f6f;
            color: #232323;
            font-weight: 500;
        }

        .btn-header {
            background: #a5a5a5;
            border: 3px outset #838383;
            color: #1f1f1f;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 8px 32px;
            cursor: pointer;
            text-transform: lowercase;
            box-shadow: none;
            font-family: 'Courier New', monospace;
        }

        .btn-header:active {
            border: 3px inset #838383;
        }

        /* рабочая зона два столбца */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            border-top: 2px solid #747474;
        }

        /* левая часть - pos */
        .pos-left {
            width: 70%;
            background: #acacac;
            border-right: 4px solid #7a7a7a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pos-header-line {
            background: #9b9b9b;
            padding: 12px 14px;
            border-bottom: 3px solid #787878;
            font-size: 1.7rem;
            font-weight: 600;
            color: #212121;
            display: flex;
            align-items: center;
            gap: 20px;
            text-transform: lowercase;
        }

        .pos-header-line span {
            background: #8a8a8a;
            padding: 6px 28px;
            border: 2px solid #6b6b6b;
            font-size: 1.4rem;
        }

        /* сетка товаров - унылые серые кнопки */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 16px;
            background: #9f9f9f;
            border-bottom: 3px groove #6a6a6a;
        }

        .product-cell {
            background: #b9b9b9;
            border: 4px outset #919191;
            color: #1d1d1d;
            padding: 28px 4px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.2;
            cursor: pointer;
            box-shadow: 0 4px 0 #6b6b6b;
            text-transform: lowercase;
            word-break: break-word;
            font-family: 'Arial', sans-serif;
        }

        .product-cell:active {
            border: 4px inset #919191;
            box-shadow: 0 1px 0 #6b6b6b;
            transform: translateY(3px);
        }

        .price-rur {
            font-size: 1.9rem;
            background: #8f8f8f;
            display: inline-block;
            padding: 4px 16px;
            margin-top: 8px;
            border: 2px solid #6b6b6b;
            color: #111;
        }

        /* блок заказа */
        .order-panel {
            background: #a3a3a3;
            border-top: 4px double #6d6d6d;
            padding: 18px;
            margin-top: auto;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 2.4rem;
            background: #8c8c8c;
            padding: 20px 28px;
            border: 3px inset #6f6f6f;
            color: #151515;
            margin-bottom: 20px;
            text-transform: lowercase;
        }

        .action-duo {
            display: flex;
            gap: 20px;
        }

        .action-btn {
            flex: 1;
            background: #9d9d9d;
            border: 6px outset #818181;
            color: #0f0f0f;
            font-size: 2.1rem;
            font-weight: 700;
            padding: 26px 0;
            cursor: pointer;
            text-transform: lowercase;
            font-family: 'Courier New', monospace;
        }

        .action-btn:active {
            border: 6px inset #818181;
        }

        /* правая часть - новый блок вместо staff permissions */
        .right-panel {
            width: 30%;
            background: #a7a7a7;
            display: flex;
            flex-direction: column;
            border-left: 4px solid #757575;
        }

        .right-header {
            background: #969696;
            padding: 20px 16px;
            border-bottom: 4px solid #6f6f6f;
            font-size: 1.7rem;
            font-weight: 600;
            color: #1b1b1b;
            text-transform: lowercase;
        }

        .info-block {
            background: #9e9e9e;
            margin: 18px;
            padding: 22px 16px;
            border: 3px inset #6b6b6b;
            font-size: 1.4rem;
            color: #1f1f1f;
            text-transform: lowercase;
        }

        .info-block div {
            padding: 8px 0;
            border-bottom: 2px solid #7e7e7e;
        }

        .helper-list {
            flex: 1;
            overflow-y: auto;
            background: #9c9c9c;
            padding: 16px 12px;
        }

        /* карточка техподдержки/заявки */
        .ticket-item {
            background: #b1b1b1;
            border: 3px outset #8c8c8c;
            padding: 20px 12px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            color: #181818;
            font-weight: 500;
        }

        .ticket-title {
            font-size: 1.5rem;
            background: #929292;
            padding: 6px;
            border: 2px solid #747474;
        }

        .ticket-detail {
            font-size: 1.2rem;
            color: #252525;
            background: #a3a3a3;
            padding: 8px;
            border: 2px inset #7c7c7c;
        }

        .dull-button {
            background: #9b9b9b;
            border: 5px outset #828282;
            color: #101010;
            font-size: 1.3rem;
            padding: 12px 12px;
            cursor: pointer;
            text-align: center;
            text-transform: lowercase;
            margin-top: 6px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            background: rgba(80,80,80,0.8);
            top: 0; left: 0; width: 100%; height: 100%;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: #a7a7a7;
            border: 10px ridge #777;
            padding: 40px 60px;
            width: 600px;
            color: #111;
            font-size: 1.7rem;
            box-shadow: none;
        }

        .modal-close-btn {
            background: #959595;
            border: 5px outset #7c7c7c;
            padding: 18px 40px;
            font-size: 1.8rem;
            margin-top: 36px;
            cursor: pointer;
            color: #141414;
            font-weight: 600;
            text-align: center;
            text-transform: lowercase;
        }

        /* скролл без украшений */
        ::-webkit-scrollbar {
            width: 18px;
            background: #888;
        }
        ::-webkit-scrollbar-thumb {
            background: #6f6f6f;
            border: 2px solid #5c5c5c;
        }
    </style>
</head>
<body>
<div class="terminal">
    <!-- хедер без эмодзи -->
    <div class="top-bar">
        <div class="employee-title">POS Logged as</div>
        <div class="full-name">ПЛЕХОВ ЛЕВ АЛЕКСАНДРОВИЧ</div>
        <button class="btn-header" id="viewProfileBtn">My account</button>
    </div>

    <!-- основной экран -->
    <div class="workspace">
        <!-- левый блок - pos -->
        <div class="pos-left">
            <div class="pos-header-line">
                <span>newpos 5.63 / сенсор</span>
                <span>кассир: плехов лев</span>
            </div>

            <!-- товарная сетка (все цены в рублях) -->
            <div class="product-grid" id="productGrid">
                <!-- скрипт заполнит -->
            </div>

            <!-- корзина и кнопки -->
            <div class="order-panel">
                <div class="total-row">
                    <span>всего:</span>
                    <span id="cartTotalRub">0 руб</span>
                </div>
                <div class="action-duo">
                    <button class="action-btn" id="clearCartBtn">удалить</button>
                    <button class="action-btn" id="payBtn">замена</button>
                </div>
            </div>
        </div>

            </div>

            <div class="helper-list" id="ticketList">
                <!-- динамические заявки -->
            </div>
            <div style="padding: 14px;">
                <button class="dull-button" id="logBtn">журнал обновлений</button>
            </div>
        </div>
    </div>

    <!-- модалка аккаунта (серая) -->
    <div id="accountModal" class="modal-overlay">
        <div class="modal-box">
            <div style="border-bottom:4px ridge #7d7d7d;">просмотр аккаунта</div>
            <p>сотрудник: ПЛЕХОВ ЛЕВ АЛЕКСАНДРОВИЧ</p>
            <p>ид: lv-5910-88</p>
            <p>роль: Кассир/HoReCa менеджер</p>
            <p>последний вход: 05.03.2026 09:14</p>
            <p>полномочия: полный доступ, изменение ролей</p>
            <div class="modal-close-btn" id="closeModalBtn">закрыть</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // меню на русском, цены в рублях
        const products = [
            { name: 'комбо №1', price: 449, desc: 'бургер+фри+кола' },
            { name: 'стейк', price: 1250, desc: 'рибай 300г' },
            { name: 'цезарь', price: 590, desc: 'курица' },
            { name: 'начос', price: 380, desc: 'сырные' },
            { name: 'латте', price: 210, desc: 'ванильный' },
            { name: 'мохито', price: 280, desc: 'без алкоголя' },
            { name: 'крылья', price: 540, desc: '8 шт' },
            { name: 'картошка', price: 190, desc: 'фри' },
        ];

        // корзина
        let cart = [];

        // продуктовая сетка
        const grid = document.getElementById('productGrid');
        function renderProducts() {
            grid.innerHTML = '';
            products.forEach(p => {
                const cell = document.createElement('div');
                cell.className = 'product-cell';
                cell.innerHTML = `${p.name} <br> <span class="price-rur">${p.price} руб</span>`;
                cell.addEventListener('click', () => {
                    cart.push(p);
                    updateTotal();
                });
                grid.appendChild(cell);
            });
        }

        function updateTotal() {
            let sum = cart.reduce((acc, i) => acc + i.price, 0);
            document.getElementById('cartTotalRub').innerText = sum + ' руб';
        }

        document.getElementById('clearCartBtn').addEventListener('click', () => {
            cart = [];
            updateTotal();
        });

        document.getElementById('payBtn').addEventListener('click', () => {
            if (cart.length === 0) {
                alert('корзина пуста');
            } else {
                let total = cart.reduce((s,i)=>s+i.price,0);
                alert(`замена (оплата) на сумму ${total} руб (имитация)`);
                cart = [];
                updateTotal();
            }
        });

        // заявки техподдержки (новый блок)
        const tickets = [
            { title: 'Коллеги не работает интерфейс бэкофиса, вызовите 099508', from: 'кассир анна', id: 'tsk-34' },
            { title: 'не открывается смена', from: 'менеджер дмитрий', id: 'tsk-41' },
            { title: 'ошибка 1с меркурий', from: 'бухгалтерия', id: 'tsk-39' },
            { title: 'требуется доступ', from: 'воробьев', id: 'tsk-45' },
        ];

        const ticketContainer = document.getElementById('ticketList');
        function renderTickets() {
            ticketContainer.innerHTML = '';
            tickets.forEach(t => {
                const div = document.createElement('div');
                div.className = 'ticket-item';
                div.innerHTML = `
                    <div class="ticket-title">${t.title}</div>
                    <div class="ticket-detail">от: ${t.from} / ${t.id}</div>
                    <div class="dull-button" style="font-size:1rem;">взять в работу</div>
                `;
                ticketContainer.appendChild(div);
            });
        }

        // модалка моего аккаунта
        const modal = document.getElementById('accountModal');
        document.getElementById('viewProfileBtn').addEventListener('click', () => {
            modal.style.display = 'flex';
        });
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.style.display = 'none';
        });
        window.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });

        // журнал (кнопка)
        document.getElementById('logBtn').addEventListener('click', () => {
            alert('журнал обновлений (mock): 05.03 плехов принял заявку tsk-41, обновил права');
        });

        // запуск
        renderProducts();
        renderTickets();
        updateTotal();
    })();
</script>
<!-- надпись убрана, нет смайлов -->
</body>
</html>
