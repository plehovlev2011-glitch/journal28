<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram • Криштиану Роналду</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --ig-primary: #000;
            --ig-secondary: #8e8e8e;
            --ig-border: #dbdbdb;
            --ig-blue: #0095f6;
            --ig-red: #ed4956;
            --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        body {
            background: #fafafa;
            color: var(--ig-primary);
            max-width: 100vw;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Splash Screen */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--ig-gradient);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .splash-logo {
            font-size: 60px;
            font-weight: 300;
            color: white;
            margin-bottom: 30px;
            letter-spacing: -2px;
        }

        .splash-text {
            color: white;
            font-size: 24px;
            font-weight: 500;
            text-align: center;
            padding: 0 20px;
            line-height: 1.4;
        }

        .splash-time {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 10px;
            font-weight: 400;
        }

        /* Main App (hidden initially) */
        #app {
            display: none;
            max-width: 600px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: white;
            border-bottom: 1px solid var(--ig-border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: max(12px, env(safe-area-inset-top));
        }

        .header h1 {
            font-size: 28px;
            font-weight: 300;
            background: var(--ig-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .header-actions {
            display: flex;
            gap: 20px;
        }

        .header-actions i {
            font-size: 24px;
            color: var(--ig-primary);
            cursor: pointer;
        }

        /* Stories */
        .stories {
            padding: 16px 0 12px;
            border-bottom: 1px solid var(--ig-border);
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .story {
            display: inline-block;
            text-align: center;
            margin: 0 10px;
            width: 70px;
        }

        .story-avatar {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            padding: 3px;
            background: var(--ig-gradient);
            margin-bottom: 6px;
        }

        .story-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
        }

        .story-name {
            font-size: 12px;
            color: var(--ig-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70px;
        }

        /* Posts */
        .post {
            background: white;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--ig-border);
        }

        .post-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .post-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f09433;
            padding: 2px;
        }

        .post-username {
            font-weight: 600;
            font-size: 14px;
        }

        .post-options {
            font-size: 20px;
            color: var(--ig-primary);
            cursor: pointer;
        }

        .post-image {
            width: 100%;
            height: auto;
            aspect-ratio: 1;
            object-fit: cover;
            background: #f0f0f0;
        }

        .post-actions {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-actions-left {
            display: flex;
            gap: 18px;
        }

        .post-actions-right {
            display: flex;
        }

        .post-action {
            font-size: 26px;
            cursor: pointer;
            color: var(--ig-primary);
            transition: transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .post-action.active {
            color: var(--ig-red);
        }

        .post-action.save.active {
            color: var(--ig-blue);
        }

        .post-action:active {
            transform: scale(0.9);
        }

        .post-likes {
            padding: 0 16px 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .post-caption {
            padding: 0 16px 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .post-caption .username {
            font-weight: 600;
            margin-right: 4px;
        }

        .post-time {
            padding: 0 16px 16px;
            color: var(--ig-secondary);
            font-size: 12px;
            text-transform: uppercase;
        }

        .post-comments {
            padding: 0 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .comment {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .comment-content {
            flex: 1;
            font-size: 14px;
        }

        .comment-username {
            font-weight: 600;
            margin-right: 4px;
        }

        .comment-like {
            color: var(--ig-secondary);
            font-size: 12px;
            cursor: pointer;
        }

        .add-comment {
            padding: 16px;
            border-top: 1px solid var(--ig-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .add-comment input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            padding: 8px 0;
        }

        .add-comment button {
            color: var(--ig-blue);
            font-weight: 600;
            background: none;
            border: none;
            font-size: 16px;
            opacity: 0.5;
            cursor: default;
        }

        .add-comment input:valid ~ button {
            opacity: 1;
            cursor: pointer;
        }

        /* Navigation */
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            border-top: 1px solid var(--ig-border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--ig-primary);
            text-decoration: none;
            font-size: 24px;
            cursor: pointer;
            position: relative;
        }

        .nav-item.active {
            color: var(--ig-primary);
        }

        .nav-label {
            font-size: 10px;
            color: var(--ig-primary);
            font-weight: 400;
        }

        /* Settings Page */
        .settings-page {
            display: none;
            padding: 20px 16px;
            min-height: calc(100vh - 60px);
        }

        .settings-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .settings-back {
            font-size: 24px;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-header h2 {
            font-size: 24px;
            font-weight: 600;
        }

        .settings-section {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--ig-border);
        }

        .settings-item:last-child {
            border-bottom: none;
        }

        .settings-item-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .settings-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--ig-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .settings-text {
            font-size: 16px;
            font-weight: 500;
        }

        .settings-arrow {
            color: var(--ig-secondary);
            font-size: 16px;
        }

        /* Loading animation */
        .loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--ig-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* iOS-like animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        .slide-up {
            animation: slideUp 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 375px) {
            .post-action {
                font-size: 24px;
            }
            
            .splash-logo {
                font-size: 50px;
            }
            
            .splash-text {
                font-size: 20px;
            }
        }

        @media (min-width: 600px) {
            body {
                background: var(--ig-primary);
                padding: 20px 0;
            }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen">
        <div class="splash-logo">Instagram</div>
        <div class="splash-text" id="greetingText"></div>
        <div class="splash-time" id="currentTime"></div>
    </div>

    <!-- Loading -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Main App -->
    <div id="app">
        <!-- Feed Page -->
        <div id="feedPage">
            <!-- Header -->
            <header class="header">
                <h1>Instagram</h1>
                <div class="header-actions">
                    <i class="far fa-heart"></i>
                    <i class="far fa-paper-plane"></i>
                </div>
            </header>

            <!-- Stories -->
            <div class="stories">
                <div class="story">
                    <div class="story-avatar">
                        <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="Тренер">
                    </div>
                    <div class="story-name">Тренер</div>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Партнер">
                    </div>
                    <div class="story-name">Партнер</div>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="https://randomuser.me/api/portraits/men/55.jpg" alt="Друг">
                    </div>
                    <div class="story-name">Друг</div>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="https://randomuser.me/api/portraits/women/68.jpg" alt="Фан">
                    </div>
                    <div class="story-name">Фан</div>
                </div>
            </div>

            <!-- Posts will be loaded here -->
            <div id="postsContainer"></div>
        </div>

        <!-- Settings Page -->
        <div id="settingsPage" class="settings-page">
            <div class="settings-header">
                <div class="settings-back" onclick="showFeed()">
                    <i class="fas fa-chevron-left"></i>
                </div>
                <h2>Настройки</h2>
            </div>

            <div class="settings-section">
                <div class="settings-item" onclick="alert('Профиль Ольги')">
                    <div class="settings-item-content">
                        <div class="settings-icon">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="settings-text">Профиль</div>
                    </div>
                    <div class="settings-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                <div class="settings-item" onclick="alert('Уведомления включены')">
                    <div class="settings-item-content">
                        <div class="settings-icon">
                            <i class="fas fa-bell"></i>
                        </div>
                        <div class="settings-text">Уведомления</div>
                    </div>
                    <div class="settings-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                <div class="settings-item" onclick="changeTheme()">
                    <div class="settings-item-content">
                        <div class="settings-icon">
                            <i class="fas fa-moon"></i>
                        </div>
                        <div class="settings-text">Темная тема</div>
                    </div>
                    <div class="settings-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-item" onclick="alert('Помощь будет скоро!')">
                    <div class="settings-item-content">
                        <div class="settings-icon" style="background: linear-gradient(45deg, #00c6ff, #0072ff);">
                            <i class="fas fa-question-circle"></i>
                        </div>
                        <div class="settings-text">Помощь</div>
                    </div>
                    <div class="settings-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                <div class="settings-item" onclick="alert('Расскажем о приложении!')">
                    <div class="settings-item-content">
                        <div class="settings-icon" style="background: linear-gradient(45deg, #fdc830, #f37335);">
                            <i class="fas fa-info-circle"></i>
                        </div>
                        <div class="settings-text">О приложении</div>
                    </div>
                    <div class="settings-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="nav">
            <div class="nav-item active" onclick="showFeed()">
                <i class="fas fa-home"></i>
                <div class="nav-label">Лента</div>
            </div>
            <div class="nav-item" onclick="showSettings()">
                <i class="fas fa-cog"></i>
                <div class="nav-label">Настройки</div>
            </div>
        </nav>
    </div>

    <script>
        // Конфигурация
        const CONFIG = {
            userName: "Ольга",
            postsPerLoad: 10,
            unsplashAccessKey: 'client_id=QhJ8kSxVZ3v5YfGqP6W7nT2cL1dM4rR9', // Публичный ключ для Unsplash
            unsplashQuery: 'cristiano ronaldo football',
            ronaldoImages: [
                'https://images.unsplash.com/photo-1594744803329-e58b31de8bf5',
                'https://images.unsplash.com/photo-1575361204480-aadea25e6e68',
                'https://images.unsplash.com/photo-1522778119026-d647f0596c20',
                'https://images.unsplash.com/photo-1543326727-cf6c39e8f84c',
                'https://images.unsplash.com/photo-1543326727-cf6c39e8f84c',
                'https://images.unsplash.com/photo-1593085512500-5d55148d6f0d',
                'https://images.unsplash.com/photo-1551958219-acbc608c6377',
                'https://images.unsplash.com/photo-1542744095-fcf48d80b0fd',
                'https://images.unsplash.com/photo-1543326727-cf6c39e8f84c',
                'https://images.unsplash.com/photo-1594744803329-e58b31de8bf5'
            ]
        };

        // Глобальные переменные
        let posts = [];
        let currentPost = 0;

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', async function() {
            // Установка приветствия
            setGreeting();
            
            // Симулируем загрузку 2 секунды
            setTimeout(async () => {
                await loadPosts();
                showApp();
            }, 2000);
            
            // Обновляем время каждую минуту
            setInterval(setGreeting, 60000);
        });

        function setGreeting() {
            const now = new Date();
            const hours = now.getHours();
            const timeString = now.toLocaleTimeString('ru-RU', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            let greeting;
            if (hours >= 5 && hours < 12) greeting = "Доброе утро";
            else if (hours >= 12 && hours < 18) greeting = "Добрый день";
            else if (hours >= 18 && hours < 23) greeting = "Добрый вечер";
            else greeting = "Доброй ночи";
            
            document.getElementById('greetingText').textContent = `${greeting}, ${CONFIG.userName}!`;
            document.getElementById('currentTime').textContent = timeString;
        }

        async function loadPosts() {
            showLoader(true);
            
            // Генерируем посты с рандомными данными
            posts = [];
            const comments = [
                "Лучший в мире! 🐐",
                "Легенда футбола!",
                "Мой кумир с детства!",
                "SUIIIIIII! ⚽",
                "Невероятный игрок!",
                "Гордость Португалии!",
                "Король футбола 👑",
                "Вечная легенда!",
                "Мотивирует каждый день!",
                "Настоящий профессионал!"
            ];
            
            const locations = ["Мадрид", "Турин", "Лиссабон", "Манчестер", "Эр-Рияд", "Стадион", "Тренировка"];
            
            for (let i = 0; i < CONFIG.postsPerLoad; i++) {
                const imgIndex = i % CONFIG.ronaldoImages.length;
                const imgUrl = `${CONFIG.ronaldoImages[imgIndex]}?auto=format&fit=crop&w=800&q=80&${CONFIG.unsplashAccessKey}`;
                
                const post = {
                    id: i + 1,
                    username: "cristiano",
                    fullName: "Cristiano Ronaldo",
                    avatar: "https://images.unsplash.com/photo-1594744803329-e58b31de8bf5?auto=format&fit=crop&w=200&q=80",
                    image: imgUrl,
                    likes: Math.floor(Math.random() * 1000000) + 500000,
                    caption: "Работа в процессе. Всегда стремлюсь быть лучше! 💪 #CR7 #GOAT #Футбол",
                    time: `${Math.floor(Math.random() * 23) + 1} ЧАСА НАЗАД`,
                    location: locations[Math.floor(Math.random() * locations.length)],
                    comments: [
                        {
                            username: "fan_account",
                            text: comments[Math.floor(Math.random() * comments.length)],
                            likes: Math.floor(Math.random() * 100)
                        },
                        {
                            username: "football_lover",
                            text: comments[Math.floor(Math.random() * comments.length)],
                            likes: Math.floor(Math.random() * 50)
                        }
                    ],
                    isLiked: false,
                    isSaved: false
                };
                posts.push(post);
            }
            
            renderPosts();
            showLoader(false);
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';
            
            posts.forEach(post => {
                const postEl = document.createElement('div');
                postEl.className = 'post fade-in';
                postEl.innerHTML = `
                    <div class="post-header">
                        <div class="post-user">
                            <img src="${post.avatar}" alt="${post.fullName}" class="post-avatar">
                            <div>
                                <div class="post-username">${post.username}</div>
                                <div style="font-size: 12px; color: var(--ig-secondary);">${post.location}</div>
                            </div>
                        </div>
                        <div class="post-options">
                            <i class="fas fa-ellipsis-h"></i>
                        </div>
                    </div>
                    <img src="${post.image}" alt="Post by ${post.username}" class="post-image" loading="lazy">
                    <div class="post-actions">
                        <div class="post-actions-left">
                            <div class="post-action ${post.isLiked ? 'active' : ''}" onclick="toggleLike(${post.id})">
                                <i class="${post.isLiked ? 'fas' : 'far'} fa-heart"></i>
                            </div>
                            <div class="post-action" onclick="addComment(${post.id})">
                                <i class="far fa-comment"></i>
                            </div>
                            <div class="post-action" onclick="sharePost(${post.id})">
                                <i class="far fa-paper-plane"></i>
                            </div>
                        </div>
                        <div class="post-actions-right">
                            <div class="post-action save ${post.isSaved ? 'active' : ''}" onclick="toggleSave(${post.id})">
                                <i class="${post.isSaved ? 'fas' : 'far'} fa-bookmark"></i>
                            </div>
                        </div>
                    </div>
                    <div class="post-likes">${formatLikes(post.likes)} отметок "Нравится"</div>
                    <div class="post-caption">
                        <span class="username">${post.username}</span> ${post.caption}
                    </div>
                    <div class="post-comments">
                        ${post.comments.map(comment => `
                            <div class="comment">
                                <img src="https://randomuser.me/api/portraits/${Math.random() > 0.5 ? 'men' : 'women'}/${Math.floor(Math.random() * 70)}.jpg" 
                                     alt="${comment.username}" class="comment-avatar">
                                <div class="comment-content">
                                    <span class="comment-username">${comment.username}</span> ${comment.text}
                                    <div style="font-size: 12px; color: var(--ig-secondary); margin-top: 4px;">
                                        ${comment.time || '2 часа назад'} · 
                                        <span class="comment-like" onclick="likeComment(${post.id}, '${comment.username}')">
                                            ${comment.likes} лайков
                                        </span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="post-time">${post.time}</div>
                    <div class="add-comment">
                        <input type="text" placeholder="Добавьте комментарий..." 
                               onkeypress="if(event.key==='Enter') postComment(${post.id}, this)">
                        <button onclick="postComment(${post.id}, this.previousElementSibling)">Опубликовать</button>
                    </div>
                `;
                container.appendChild(postEl);
            });
            
            // Добавляем обработчик прокрутки для бесконечной ленты
            window.addEventListener('scroll', handleScroll);
        }

        function handleScroll() {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) {
                loadMorePosts();
            }
        }

        async function loadMorePosts() {
            // Удаляем обработчик чтобы избежать множественных вызовов
            window.removeEventListener('scroll', handleScroll);
            
            showLoader(true);
            
            // Симулируем загрузку
            setTimeout(() => {
                loadPosts().then(() => {
                    showLoader(false);
                });
            }, 1000);
        }

        function toggleLike(postId) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.isLiked = !post.isLiked;
                post.likes += post.isLiked ? 1 : -1;
                renderPosts();
                
                // Анимация сердца
                const heartIcon = document.querySelector(`[onclick="toggleLike(${postId})"] i`);
                heartIcon.style.transform = 'scale(1.3)';
                setTimeout(() => {
                    heartIcon.style.transform = 'scale(1)';
                }, 300);
            }
        }

        function toggleSave(postId) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.isSaved = !post.isSaved;
                renderPosts();
                
                // Анимация сохранения
                const saveIcon = document.querySelector(`[onclick="toggleSave(${postId})"] i`);
                saveIcon.style.transform = 'translateY(-5px)';
                setTimeout(() => {
                    saveIcon.style.transform = 'translateY(0)';
                }, 300);
            }
        }

        function addComment(postId) {
            const input = document.querySelector(`[onkeypress="if(event.key==='Enter') postComment(${postId}, this)"]`);
            input.focus();
            input.scrollIntoView({ behavior: 'smooth' });
        }

        function postComment(postId, inputElement) {
            const comment = inputElement.value.trim();
            if (!comment) return;
            
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.comments.push({
                    username: CONFIG.userName.toLowerCase(),
                    text: comment,
                    likes: 0
                });
                renderPosts();
                inputElement.value = '';
                
                // Показываем подтверждение
                alert('Комментарий добавлен!');
            }
        }

        function likeComment(postId, username) {
            // Простая анимация лайка комментария
            alert(`Лайк комментарию от ${username}!`);
        }

        function sharePost(postId) {
            // Имитация шаринга
            alert('Пост будет опубликован в вашей истории!');
        }

        function formatLikes(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1).replace('.', ',') + ' млн';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1).replace('.', ',') + ' тыс';
            }
            return num.toLocaleString('ru-RU');
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
        }

        function showApp() {
            document.getElementById('splashScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splashScreen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            }, 500);
        }

        function showFeed() {
            document.getElementById('feedPage').style.display = 'block';
            document.getElementById('settingsPage').style.display = 'none';
            
            // Обновляем активную кнопку в навигации
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.nav-item')[0].classList.add('active');
        }

        function showSettings() {
            document.getElementById('feedPage').style.display = 'none';
            document.getElementById('settingsPage').style.display = 'block';
            
            // Обновляем активную кнопку в навигации
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.nav-item')[1].classList.add('active');
        }

        function changeTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            alert(isDark ? 'Темная тема включена!' : 'Светлая тема включена!');
        }

        // Добавляем стили для темной темы
        const darkThemeStyles = `
            <style id="darkTheme">
                .dark-theme {
                    background: #000;
                    color: #fff;
                }
                .dark-theme #app {
                    background: #000;
                }
                .dark-theme .header,
                .dark-theme .nav,
                .dark-theme .post,
                .dark-theme .settings-section {
                    background: #000;
                    border-color: #333;
                }
                .dark-theme .post-caption,
                .dark-theme .post-username,
                .dark-theme .settings-text {
                    color: #fff;
                }
                .dark-theme .post-time,
                .dark-theme .comment-like {
                    color: #8e8e8e;
                }
                .dark-theme .add-comment input {
                    color: #fff;
                }
            </style>
        `;
        document.head.insertAdjacentHTML('beforeend', darkThemeStyles);
    </script>
</body>
</html>
